displayName: Logger
type: middleware
iconPath: .assets/icon.png

import: github.com/gabay/logger

summary: 'Writes access logs to a file with a configurable format and scheduled, compressed rotation'

testData:
  # Relative paths are resolved against Traefik's working directory; use an
  # absolute path such as /var/log/traefik/access.log in production.
  file: access.log
  # When no format is given, the Common Log Format is used:
  # {.Ip} - {.User} [{.Time}] "{.Method} {.Path}" {.Status} {.ResponseSize} "{.Referer}" "{.UserAgent}"
  format: '{.Ip} - {.User} [{.Time}] "{.Method} {.Path}" {.Status} {.ResponseSize} "{.Referer}" "{.UserAgent}"'
  # Proxies whose X-Forwarded-For / X-Real-Ip headers are trusted for
  # {.ClientIp} (optional; also list them in the entrypoint's
  # forwardedHeaders.trustedIPs).
  trustedForwarders:
    - 10.0.0.0/8
  # Entries buffered per file before new ones are dropped (optional).
  queueSize: 8192
  # Rotation is optional; when present it defaults to daily at midnight,
  # keeping 1 plain-text file and 0 compressed files.
  rotate:
    schedule: "0 0 * * *"
    # keep access.log.1 and access.log.2
    keep: 2
    # also keep access.log.3.gz and access.log.4.gz
    keepCompressed: 2