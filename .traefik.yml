displayName: Logger
type: middleware
iconPath: .assets/icon.png

import: github.com/gabay/logger

summary: 'Access logs with configurable format, rotation schedule and compression'

testData:
  # Relative paths are resolved against Traefik's working directory
  file: access.log
  # (optional) Log format. Defaults to Common Log Format.
  format: '{.Ip} - {.User} [{.Time}] "{.Method} {.Path}" {.Status} {.ResponseSize} "{.Referer}" "{.UserAgent}"'
  # (optional) Proxies whose X-Forwarded-For / X-Real-Ip headers are trusted for {.ClientIp}.
  trustedForwarders:
    - 10.0.0.0/8
  # (optional) Entries buffered per file before new ones are dropped.
  queueSize: 8192
  # (optional) Streaming requests (Server-Sent Events, gRPC, and paths under
  # streamingPaths) are not wrapped, so they are flushed live; their
  # {.Status} is "-". detection is on by default.
  detectStreaming: true
  streamingPaths:
    - /events/
  # (optional) Rotation configuration; when present it defaults to daily at midnight,
  # keeping 1 plain-text file and 0 compressed files.
  rotate:
    schedule: "0 0 * * *"
    # keep access.log.1 and access.log.2
    keep: 2
    # also keep access.log.3.gz and access.log.4.gz
    keepCompressed: 2
