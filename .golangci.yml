version: "2"

run:
  timeout: 3m

linters:
  default: all
  disable:
    - cyclop # duplicate of gocyclo
    - bodyclose # too many false positives: https://github.com/timakin/bodyclose/issues/30
    - depguard # no import restrictions in this project
    - dupl
    - err113
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - intrange # range-over-int is not reliably supported by Yaegi
    - lll
    - mnd
    - nlreturn
    - noctx
    - paralleltest
    - rowserrcheck # not relevant (SQL)
    - sqlclosecheck # not relevant (SQL)
    - testpackage # tests exercise unexported internals (writer, rotation)
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
    - noinlineerr # `if err := f(); err != nil` is idiomatic
    - gomodguard # deprecated
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocyclo:
      min-complexity: 12
    goconst:
      min-len: 5
      min-occurrences: 4
    misspell:
      locale: US
    funlen:
      lines: -1
      statements: 50
    gosec:
      excludes:
        - G304 # file paths come from the operator's configuration by design
    modernize:
      disable:
        - rangeint # range-over-int is not reliably supported by Yaegi
    godox:
      keywords:
        - FIXME
  exclusions:
    paths:
      - vendor
    rules:
      - path: (.+)_test.go
        linters:
          - goconst
          - funlen
          - godot
          - forcetypeassert
          - gosec
          - gocyclo
          - gochecknoglobals

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
  exclusions:
    paths:
      - vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
